name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual run = dry run: validates, tests, and builds every installer as a
  # downloadable workflow artifact, but publishes no GitHub release.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag format and derive version
        id: version
        run: |
          PKG_VERSION="$(jq -r .version apps/desktop/package.json)"
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "Manual dry run: using apps/desktop/package.json version $PKG_VERSION, no tag checks."
            echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="$GITHUB_REF_NAME"
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Tag '$TAG' does not match the required vX.Y.Z format (e.g. v0.0.1)."
            exit 1
          fi

          if [[ "$PKG_VERSION" != "$VERSION" ]]; then
            echo "::error::apps/desktop/package.json version '$PKG_VERSION' does not match tag-derived version '$VERSION'. Bump it before tagging."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Derived version $VERSION from tag $TAG; apps/desktop/package.json agrees."

      - name: Confirm tag is on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA (tag $GITHUB_REF_NAME) is not an ancestor of origin/main. Releases may only be tagged from main."
            exit 1
          fi
          echo "Confirmed $GITHUB_SHA is on main."

      # Version comes from package.json's "packageManager" field.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm --filter @violin/desktop run make

      # Windows: Squirrel Setup.exe + a portable zip. macOS: a zip of the .app.
      # Squirrel's .nupkg/RELEASES files are auto-update plumbing this app
      # doesn't use, so they're deliberately left out of the release.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: |
            apps/desktop/out/make/**/*.exe
            apps/desktop/out/make/**/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [validate, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mapfile -t FILES < <(find installers -type f \( -name '*.exe' -o -name '*.zip' \) | sort)
          if [[ "${#FILES[@]}" -eq 0 ]]; then
            echo "::error::No installers were downloaded from the build jobs."
            exit 1
          fi
          printf 'Publishing:\n'; printf '  %s\n' "${FILES[@]}"

          printf '%s\n' \
            "Violin Practice ${VERSION}" \
            "" \
            "### Install on Windows" \
            "Download \`ViolinPractice-Setup.exe\` and run it. The app is not code-signed, so Windows SmartScreen will warn the first time: click **More info**, then **Run anyway**. It installs per-user (no admin rights needed) and adds a Start Menu shortcut. Prefer not to install? Download the \`win32\` zip instead, extract it anywhere, and run \`Violin Practice.exe\`." \
            "" \
            "Windows must allow desktop apps to use the microphone: **Settings > Privacy & security > Microphone > Let desktop apps access your microphone**. Then pick your audio interface in the app with **Detect input devices**." \
            "" \
            "### Install on macOS (Apple Silicon)" \
            "Download the \`darwin\` zip and extract it. The app is not notarized, so macOS will refuse to open it until you clear the quarantine flag: \`xattr -cr \"Violin Practice.app\"\`." \
            > notes-header.md

          gh release create "$GITHUB_REF_NAME" \
            "${FILES[@]}" \
            --verify-tag \
            --generate-notes \
            --notes-file notes-header.md
