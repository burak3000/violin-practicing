name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Version comes from package.json's "packageManager" field.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # packages/core, packages/dsp-ts (incl. the TS-vs-C++ conformance
      # suite, which reads the checked-in WAV fixtures), and apps/mobile.
      - name: Run tests
        run: pnpm test

  dsp-native:
    name: C++ DSP reference (CTest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `pnpm install`: these two scripts only shell out to cmake/ctest.
      - name: Build packages/dsp-native
        run: pnpm build:dsp-native

      - name: Run the YIN/MPM validation harness
        run: pnpm test:dsp-native

  desktop-windows:
    name: Desktop installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `make`, not just `package`: the Squirrel installer step is the part
      # of the Windows build most likely to break, so exercise it on every
      # push rather than discovering a failure at release time.
      - name: Build the Windows installer
        run: pnpm --filter @violin/desktop run make

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: violin-practice-windows-${{ github.sha }}
          path: |
            apps/desktop/out/make/squirrel.windows/**/*.exe
            apps/desktop/out/make/zip/win32/**/*.zip
          if-no-files-found: error
          retention-days: 7
